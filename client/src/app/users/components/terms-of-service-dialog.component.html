<form class="d-flex flex-column overflow-hidden" (ngSubmit)="submit()">
  <app-modal-header (cancel)="cancel()">
    Terms of Service
  </app-modal-header>

  <app-modal-body class="d-flex flex-column overflow-hidden">
    <app-terms-of-service-text></app-terms-of-service-text>
  </app-modal-body>

  <app-modal-footer>
    <button type="button" class="btn btn-secondary me-2" (click)="cancel()">Disagree</button>
    <button type="submit" class="btn btn-primary">Agree</button>
  </app-modal-footer>
</form>
