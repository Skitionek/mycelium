name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  appserver-tests:
    name: Appserver Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: appserver
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        working-directory: appserver
        run: pytest tests/unit/ -v
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres

  appserver-database-tests:
    name: Appserver Database Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      neo4j:
        image: neo4j:4.4-community
        env:
          NEO4J_AUTH: neo4j/password
        options: >-
          --health-cmd "wget -q -O - http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 7687:7687

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: appserver
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      # Solr cannot be a `services:` container: the `file` core is created by
      # the image's `solr-precreate` command, and service containers cannot
      # override the command. Without that core the suite fails immediately
      # with 87 connection errors against /solr/file/update.
      - name: Start Solr with the file core
        run: |
          docker run -d --name solr -p 8983:8983 solr:9 solr-precreate file
          for _ in $(seq 1 30); do
            if curl -sf "http://localhost:8983/solr/admin/cores?action=STATUS" >/dev/null; then
              echo "solr ready"
              exit 0
            fi
            sleep 5
          done
          echo "solr did not become ready" >&2
          exit 1

      # The suite expects the schema to exist; nothing in the fixtures creates
      # it.
      - name: Create the schema
        working-directory: appserver
        run: flask db upgrade
        env:
          FLASK_APP: app.py
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres

      # The three files that used to be excluded here now run: #619 fixed the
      # `session` fixture, so a test whose service layer commits no longer
      # leaks rows into the next one.
      #
      # tests/api is not run here at all -- it hangs indefinitely (#620).
      - name: Run database tests
        working-directory: appserver
        run: pytest tests/database -v
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          NEO4J_HOST: localhost
          NEO4J_PORT: 7687
          NEO4J_AUTH: neo4j/password
          SOLR_URL: http://localhost:8983/solr

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: client
        run: yarn test
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  client-storybook:
    name: Client Storybook Snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Image snapshots are only byte-reproducible against one browser build, so
    # this must be the same image (and tag) that `yarn snapshot:docker` uses
    # locally to regenerate them. Keep it in step with the pinned `playwright`
    # dependency in client/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Check every in-scope component has a story
        working-directory: client
        run: yarn check-story-coverage

      - name: Build Storybook
        working-directory: client
        run: yarn build-storybook --quiet
        env:
          NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

      - name: Compare image snapshots
        working-directory: client
        run: yarn snapshot

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: image-snapshot-diffs
          path: client/__image_snapshots__/__diff_output__/
          if-no-files-found: ignore

  statistical-enrichment-tests:
    name: Statistical Enrichment Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: statistical-enrichment
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: statistical-enrichment
        run: pytest tests/ -v

  cache-invalidator-tests:
    name: Cache Invalidator Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: cache-invalidator
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: cache-invalidator
        run: pytest tests/ -v
