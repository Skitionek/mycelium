name: Lint

on:
  push:
    branches:
      - main
  pull_request:

# Default to read-only; individual jobs grant only the permissions they need.
permissions: read-all

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit auto-fixes
      issues: write
      pull-requests: write
      security-events: write # needed to upload SARIF

    steps:
      - name: Run unified lint action
        uses: Skitionek/lint@44cdaca8cb2c10077e34583e91f1f574369b0f32
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Upload SARIF for PR annotations ───────────────────────────────────
      # The action above turns MegaLinter's SARIF reporter on but does not
      # publish the file, so uploading it is the one thing left to do here.
      # Everything else that used to live in this job -- deciding whether to
      # open a fix PR, opening it, commenting on it, failing the build when it
      # exists -- now happens inside that action, which carries its own
      # fix_check/cpr steps.
      - name: Upload SARIF report
        if: >
          (github.event_name == 'pull_request' || github.event_name == 'push') &&
          always()
        # continue-on-error so the job doesn't fail when SARIF wasn't produced
        # (e.g. no linting errors were found, or the reporter was not enabled).
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
          category: megalinter
