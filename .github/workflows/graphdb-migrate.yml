name: Graph DB Migrate

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Target stage (determines Neo4j host and data-file prefix via environment vars)
        type: choice
        required: true
        default: stage
        options:
          - stage
          - prod
      log_level:
        description: Log level
        type: choice
        required: true
        default: info
        options:
          - debug
          - info
          - warn
          - error
      release_lock:
        description: Release any present lock before executing
        type: boolean
        required: true
        default: true
      chunk_size:
        description: Liquibase transaction chunk size
        type: string
        required: true
        default: '2000'
      changelog:
        description: Master changelog to run
        type: choice
        required: true
        default: mycelium-graph/changelog-master.xml
        options:
          - mycelium-graph/changelog-master.xml
          - new-mycelium-graph/changelog-master.xml
          - small-test-graph/changelog-master.xml
          - ecocyc-plus/changelog-master.xml
          - reactome-gds/changelog-master.xml
      migrator_image_tag:
        description: Tag of the graphdb-migrator image to use
        type: string
        required: true
        default: latest

# Restrict default token permissions; job only needs to read the repo.
permissions: read-all

jobs:
  migrate:
    name: Migrate Neo4j DB
    runs-on: self-hosted
    timeout-minutes: 360
    # Environment gates this job to a known stage and scopes its secrets/vars.
    # NEO4J_HOST, NEO4J_USERNAME, and DATAFILES_PREFIX must be set as environment
    # variables in the 'stage' and 'prod' GitHub environments respectively.
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
    container:
      image: ghcr.io/skitionek/mycelium-graphdb-migrator:${{ github.event.inputs.migrator_image_tag }}
      options: --user root
      env:
        NEO4J_HOST: ${{ vars.NEO4J_HOST }}
        NEO4J_USERNAME: ${{ vars.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        LOG_LEVEL: ${{ github.event.inputs.log_level }}
        CHANGELOG_FILE: ${{ github.event.inputs.changelog }}
        DATAFILES_PREFIX: ${{ vars.DATAFILES_PREFIX }}
        AZURE_ACCOUNT_STORAGE_KEY: ${{ secrets.AZURE_ACCOUNT_STORAGE_KEY }}
        AZURE_ACCOUNT_STORAGE_NAME: ${{ secrets.AZURE_ACCOUNT_STORAGE_NAME }}
        CHUNK_SIZE: ${{ github.event.inputs.chunk_size }}
    steps:
      - uses: actions/checkout@v7
      - name: Copy changelog files
        run: cp -rp graph-db/changelog/* /liquibase/changelog/
      - name: Release previous lock
        if: ${{ inputs.release_lock }}
        run: /docker-entrypoint.sh releaseLocks
      - name: Run Liquibase migrations
        run: /docker-entrypoint.sh update
