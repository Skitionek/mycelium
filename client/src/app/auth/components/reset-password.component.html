<div class="card m-auto" style="width: 500px">
  <div class="card-header">
    Choose a new password
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <app-form-row for="newPassword" label="New password" [control]="form.get('newPassword')">
        <input type="password" formControlName="newPassword" id="newPassword"
               [appFormInput]="form.get('newPassword')" appAutoFocus>
      </app-form-row>

      <app-form-row for="confirmPassword" label="Confirm password"
                    [control]="form.get('confirmPassword')">
        <input type="password" formControlName="confirmPassword" id="confirmPassword"
               [appFormInput]="form.get('confirmPassword')">
      </app-form-row>

      <p class="text-muted small">
        Must be at least {{ minPasswordLength }} characters.
      </p>

      <div *ngIf="form.get('confirmPassword').dirty && !passwordsMatch"
           class="alert alert-warning">
        The two passwords do not match.
      </div>

      <button type="submit" class="btn btn-primary btn-block"
              [class.disabled]="form.invalid || !passwordsMatch || submitting"
              [disabled]="form.invalid || !passwordsMatch || submitting"
              [title]="form.invalid || !passwordsMatch
                ? 'Enter a matching password of at least ' + minPasswordLength + ' characters'
                : ''">
        {{ submitting ? 'Setting password...' : 'Set password' }}
      </button>
    </form>
  </div>
</div>
