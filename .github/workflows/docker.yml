name: Docker images

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  REPOSITORY: ${{ github.repository }}

jobs:
  publish-images:
    name: Build ${{ matrix.name }} Docker image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: appserver
            path: appserver
          - name: frontend
            path: client
          # - name: elasticsearch
          #   path: docker
          #   file: docker/elasticsearch.Dockerfile
          # - name: Grap data migrator
          #   path: graph-db
          #   image: mycelium-graph-db

    permissions:
      contents: read
      # Needed only by the publish path (push to main / release tags); pull
      # requests build without logging in to or writing to the registry.
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pull requests only build the image to validate the Dockerfile; nothing is
      # published, so the registry login is skipped there.
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build ${{ env.REGISTRY }}/${{ env.REPOSITORY }}-${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.file }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only publish from main and release tags; PRs build for validation only.
          push: ${{ github.event_name != 'pull_request' }}
