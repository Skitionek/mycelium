<form (ngSubmit)="submit()">
  <app-modal-header (cancel)="cancel()">Results</app-modal-header>

  <app-modal-body>
    <div ngbAccordion>
      <div ngbAccordionItem>
        <h2 ngbAccordionHeader>
          <button ngbAccordionButton>Files that failed to annotate</button>
        </h2>
        <div ngbAccordionCollapse>
          <div ngbAccordionBody>
            <ng-template>
              <ul *ngFor="let file of failed">
                <li>
                  Filename: {{file.filename}}<br>
                  Error: {{file.error}}
                </li>
              </ul>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </app-modal-body>

  <app-modal-footer>
    <button type="submit" class="btn btn-primary" (click)="cancel()">Close</button>
  </app-modal-footer>
</form>
