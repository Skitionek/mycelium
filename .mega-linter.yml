# MegaLinter configuration
# https://megalinter.io/latest/configuration/

# Apply auto-fixes for all supported linters
APPLY_FIXES: all
APPLY_FIXES_EVENT: pull_request
APPLY_FIXES_MODE: pull_request

# Linters to enable (subset relevant to this repo: Python + misc)
# TYPESCRIPT_ES / JAVASCRIPT_ES stay disabled, but no longer because the config is
# broken: client/ is linted by eslint in the `Client Lint` job of tests.yml instead.
# That has to run there rather than here, because the config loads @angular-eslint
# plugins and a type-aware parser pointed at client/tsconfig.json, none of which
# MegaLinter's container can resolve without the project's own node_modules.
# PYTHON_MYPY is disabled: cross-package duplicate-module-name issue when scanning
# appserver/ and statistical-enrichment/ together. Type checking runs via appserver/setup.cfg.
ENABLE_LINTERS:
  - PYTHON_RUFF
  - JSON_PRETTIER
  - YAML_PRETTIER
  - MARKDOWN_MARKDOWNLINT
  - SPELL_CSPELL
  - REPOSITORY_TRIVY
  - REPOSITORY_CHECKOV

# Paths to exclude from linting
# graph-db/ uses wildcard imports by design (legacy extractor scripts); excluded from ruff via ruff.toml too
FILTER_REGEX_EXCLUDE: (appserver/migrations|graph-db/|node_modules|dist|\.git|vendor|venv|\.venv|__pycache__|\.pytest_cache)

# Reporters
REPORTERS:
  - GitHub
  - SARIF
  - Text

# MegaLinter flavour: use the full image (no flavour restriction)
# Disable suggestions for flavour optimization (keep CI simple)
FLAVOR_SUGGESTIONS: false

# Git-related settings
VALIDATE_ALL_CODEBASE: false # only lint changed files on PRs
# On push to main, lint everything
# VALIDATE_ALL_CODEBASE: true  # uncomment for full scan on push

# Python: use ruff instead of flake8/pycodestyle (ruff is much faster)
PYTHON_RUFF_CONFIG_FILE: ruff.toml
PYTHON_RUFF_ARGUMENTS: "--no-fix" # fixes handled in lint.yml's fast-lint step

# Markdown
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.json

# Disable spell-check for now (too many false positives in code)
SPELL_CSPELL_DISABLE_ERRORS: true

# Trivy: informational only (errors handled by CodeQL)
REPOSITORY_TRIVY_DISABLE_ERRORS: true
# Checkov findings are informational only (warnings); they do not block CI
REPOSITORY_CHECKOV_DISABLE_ERRORS: true

# Upload SARIF to GitHub Security tab (see lint.yml for the upload step)
SARIF_REPORTER: true
