<form class="d-flex flex-column justify-content-between">
    <fieldset class="fieldset-properties mt-2">
        <legend container="body"
                ngbTooltip="Click a checkbox to filter annotations of that type"
                placement="top left right">Trace
            Details:
        </legend>
        <div ngbAccordion>
            <div ngbAccordionItem="source" [collapsed]="false">
                <h2 ngbAccordionHeader>
                    <app-button-with-selectable-text ngbAccordionToggle>
                        <b title>Source</b>
                        {{ getNodeById(entity.source).id }}
                    </app-button-with-selectable-text>
                </h2>
                <div ngbAccordionCollapse>
                    <div ngbAccordionBody>
                        <ng-template>
                            {{ getNodeById(entity.source).description }}
                        </ng-template>
                    </div>
                </div>
            </div>
            <div ngbAccordionItem="target" [collapsed]="false">
                <h2 ngbAccordionHeader>
                    <app-button-with-selectable-text ngbAccordionToggle>
                        <b title>Target</b>
                        {{ getNodeById(entity.target).id }}
                    </app-button-with-selectable-text>
                </h2>
                <div ngbAccordionCollapse>
                    <div ngbAccordionBody>
                        <ng-template>
                            {{ getNodeById(entity.target).description }}
                        </ng-template>
                    </div>
                </div>
            </div>
            <div ngbAccordionItem [disabled]="true">
                <h2 ngbAccordionHeader>
                    <app-button-with-selectable-text ngbAccordionToggle [disabled]="true">
                        <b title>Group</b>
                        {{ parseProperty(entity.group) }}
                    </app-button-with-selectable-text>
                </h2>
                <div ngbAccordionCollapse><div ngbAccordionBody><ng-template></ng-template></div></div>
            </div>
            <div ngbAccordionItem [disabled]="true" *ngIf="entity.detail_edges">
                <h2 ngbAccordionHeader>
                    <button (click)="openTraceView(entity)" class="btn btn-link">Show detailed
                        network
                    </button>
                </h2>
                <div ngbAccordionCollapse><div ngbAccordionBody><ng-template></ng-template></div></div>
            </div>
            <div ngbAccordionItem>
                <h2 ngbAccordionHeader>
                    <button ngbAccordionToggle>Details</button>
                </h2>
                <div ngbAccordionCollapse>
                    <div ngbAccordionBody>
                        <ng-template>
                            <app-object-explorer [dataSource]="entity"></app-object-explorer>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>
</form>
