name: Release

on:
  workflow_run:
    workflows:
      - Lint
      - Tests
      - CodeQL Advanced
    types:
      - completed

permissions: read-all

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Release on successful push checks
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Verify all required workflows passed for this commit
        id: gate
        uses: actions/github-script@v9
        with:
          script: |
            const requiredWorkflows = ['Lint', 'Tests', 'CodeQL Advanced'];
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;
            const branch = context.payload.workflow_run.head_branch;

            const ref = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`
            }).catch((error) => {
              core.warning(`Failed to resolve branch ref heads/${branch}: ${error.message}`);
              return null;
            });

            if (!ref || ref.data.object.sha !== sha) {
              core.info(`Branch ${branch} no longer points at ${sha}; skipping stale release run.`);
              core.setOutput('ready', 'false');
              return;
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                event: 'push',
                branch,
                head_sha: sha,
                per_page: 100
              }
            );

            const latestByName = new Map();
            for (const run of runs) {
              if (!requiredWorkflows.includes(run.name)) continue;
              const previous = latestByName.get(run.name);
              if (!previous || new Date(run.created_at) > new Date(previous.created_at)) {
                latestByName.set(run.name, run);
              }
            }

            const missing = [];
            const incomplete = [];
            const failed = [];
            for (const name of requiredWorkflows) {
              const run = latestByName.get(name);
              if (!run) {
                missing.push(name);
                continue;
              }
              if (run.status !== 'completed') {
                incomplete.push(`${name} (${run.status})`);
                continue;
              }
              if (run.conclusion !== 'success') {
                failed.push(`${name} (${run.conclusion})`);
              }
            }

            if (missing.length || incomplete.length || failed.length) {
              core.info(`Skipping release; missing=${missing.join(', ') || 'none'} incomplete=${incomplete.join(', ') || 'none'} failed=${failed.join(', ') || 'none'}`);
              core.setOutput('ready', 'false');
              return;
            }

            core.setOutput('ready', 'true');
            core.setOutput('sha', sha);

      - name: Checkout repository
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          # Pin the commit the gate validated. For a workflow_run event
          # checkout would otherwise take the default branch's current head,
          # so the release notes could describe a commit that is not the one
          # being tagged.
          ref: ${{ steps.gate.outputs.sha }}
          fetch-depth: 0

      # The release used to roll `## [Unreleased]` over into a dated section,
      # commit that, and push the commit to main. That push can never succeed:
      # the "QA" ruleset on main requires five status checks with a strict
      # up-to-date policy, github-actions[bot] is not a bypass actor, and a
      # commit arriving by direct push has no checks against it. Every attempt
      # that got this far died on
      #   remote: error: GH013: Repository rule violations found for
      #   refs/heads/main
      # so no tag was ever created (#613).
      #
      # Nothing is pushed to main any more. The tag is the release, and the
      # Unreleased notes go in the release body instead of a commit. Tags are
      # not covered by that ruleset, which targets branches.

      - name: Read release notes from CHANGELOG
        if: steps.gate.outputs.ready == 'true'
        id: notes
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          marker = "## [Unreleased]"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if marker not in text:
              raise RuntimeError("CHANGELOG.md is missing '## [Unreleased]' section")

          after = text.split(marker, 1)[1]
          next_section = re.search(r"(?m)^## \[", after)
          body = (after[: next_section.start()] if next_section else after).strip("\n")

          if not re.search(r"(?m)^\s*-\s+", body):
              body = "No documented changelog entries for this release."

          # A heredoc delimiter keeps multi-line markdown intact in the step
          # output. The delimiter must not occur in the body itself.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"body<<CHANGELOG_EOF\n{body}\nCHANGELOG_EOF\n")
          PY

      - name: Create and push the release tag
        if: steps.gate.outputs.ready == 'true'
        id: tag
        run: |
          git fetch --tags
          TAG_BASE="v$(date -u +%Y-%m-%d)"
          TAG="$TAG_BASE"
          INDEX=1
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; do
            TAG="${TAG_BASE}.${INDEX}"
            INDEX=$((INDEX + 1))
          done

          # Tag the exact commit the gate validated rather than whatever main
          # points at now. main moving on in the meantime is normal on an
          # active branch and no longer has any bearing on the release, which
          # is what the old "branch advanced from validated commit" check used
          # to fail the whole run over.
          git tag -a "$TAG" -m "Release $TAG" "${{ steps.gate.outputs.sha }}"
          git push origin "refs/tags/$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.gate.outputs.ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ steps.gate.outputs.sha }}
          name: Release ${{ steps.tag.outputs.tag }} (${{ steps.tag.outputs.release_date }})
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: true
