name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  appserver-tests:
    name: Appserver Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: appserver
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        working-directory: appserver
        run: pytest tests/unit/ -v
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres

  client-tests:
    name: Client Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: client
        run: yarn test
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  client-storybook:
    name: Client Storybook Snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Image snapshots are only byte-reproducible against one browser build, so
    # this must be the same image (and tag) that `yarn snapshot:docker` uses
    # locally to regenerate them. Keep it in step with the pinned `playwright`
    # dependency in client/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Check every in-scope component has a story
        working-directory: client
        run: yarn check-story-coverage

      - name: Build Storybook
        working-directory: client
        run: yarn build-storybook --quiet
        env:
          NODE_OPTIONS: --openssl-legacy-provider --max_old_space_size=4096

      - name: Compare image snapshots
        working-directory: client
        run: yarn snapshot

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: image-snapshot-diffs
          path: client/__image_snapshots__/__diff_output__/
          if-no-files-found: ignore

  statistical-enrichment-tests:
    name: Statistical Enrichment Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: statistical-enrichment
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: statistical-enrichment
        run: pytest tests/ -v

  cache-invalidator-tests:
    name: Cache Invalidator Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: cache-invalidator
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: cache-invalidator
        run: pytest tests/ -v
