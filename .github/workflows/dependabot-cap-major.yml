name: Cap Dependabot major bumps

# What this does
# --------------
# When Dependabot proposes a bump that skips more than one major version
# (e.g. 1.x → 3.x), this workflow:
#   1. Creates a short-lived branch, patches .github/dependabot.yml to add an
#      `ignore` rule that caps the package at the next single major (prev+2
#      exclusive), and opens a PR against the default branch.
#   2. Comments on the original Dependabot PR explaining what happened and
#      closes it; once the patch PR merges, Dependabot will re-open it for
#      the single-major bump on its next scheduled run.
#
# When Dependabot proposes a single-major bump and an existing cap rule
# covers that dependency, the workflow also advances the cap by one major
# (e.g. >=17 → >=18) so the next major can be proposed in turn.
#
# No special credentials are required — GITHUB_TOKEN with contents:write and
# pull-requests:write is sufficient because this workflow only pushes to a
# new branch, not directly to the protected default branch.
#
# Why pull_request_target
# -----------------------
# A Dependabot-triggered `pull_request` event gets a read-only token and
# cannot read Actions secrets. `pull_request_target` runs in the base repo's
# context instead. This job never checks out or executes code from the PR
# head, so that is safe.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-cap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cap:
    name: Cap if multi-major
    runs-on: ubuntu-latest
    # Only act on Dependabot PRs; skip drafts (they are never multi-major caps).
    if: >
      startsWith(github.event.pull_request.user.login, 'dependabot') &&
      !github.event.pull_request.draft

    steps:
      # fetch-metadata parses the Dependabot commit message to surface the
      # version delta without needing to inspect lockfiles or manifests.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Decide what to do:
      #   cap  — multi-major bump; write a new ignore rule.
      #   lift — single-major bump; check whether an existing cap should advance.
      #   skip — not a semver-major bump; nothing to do.
      - name: Determine action
        id: check
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW:  ${{ steps.meta.outputs.new-version }}
        run: |
          set -euo pipefail

          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "Not a major bump (type: $UPDATE_TYPE); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip any leading non-numeric prefix (e.g. "v1.2.3" → 1).
          prev_major=$(printf '%s' "$PREV" | grep -oP '^\D*\K[0-9]+' || true)
          new_major=$(printf '%s' "$NEW"  | grep -oP '^\D*\K[0-9]+' || true)

          if [ -z "$prev_major" ] || [ -z "$new_major" ]; then
            echo "::warning::Cannot parse major versions from '$PREV' → '$NEW'; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff=$((new_major - prev_major))
          if [ "$diff" -le 1 ]; then
            # Single-major bump: might need to advance an existing cap.
            echo "Single-major bump ($PREV → $NEW); will check for a cap to advance."
            echo "skip=false"             >> "$GITHUB_OUTPUT"
            echo "action=lift"            >> "$GITHUB_OUTPUT"
            echo "prev_major=$prev_major" >> "$GITHUB_OUTPUT"
            echo "new_major=$new_major"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Cap: only the immediately next major is allowed (prev+1.x).
          # The ignore rule will be `>= prev+2`, blocking anything beyond that.
          cap=$((prev_major + 2))
          next_major=$((prev_major + 1))

          echo "Multi-major bump: $PREV → $NEW (${diff} majors). Capping at < $cap."
          echo "skip=false"         >> "$GITHUB_OUTPUT"
          echo "action=cap"         >> "$GITHUB_OUTPUT"
          echo "prev_major=$prev_major" >> "$GITHUB_OUTPUT"
          echo "new_major=$new_major"   >> "$GITHUB_OUTPUT"
          echo "next_major=$next_major" >> "$GITHUB_OUTPUT"
          echo "cap=$cap"              >> "$GITHUB_OUTPUT"

      # Check out the default branch so we can branch off it for the patch PR.
      - name: Check out default branch
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install ruamel.yaml
        if: steps.check.outputs.skip == 'false'
        run: pip install --quiet 'ruamel.yaml>=0.18'

      # Edit .github/dependabot.yml via the standalone script, which handles:
      #   cap  — adds / updates an ignore rule so only the next single major is proposed.
      #   lift — advances an existing cap by one major now that the allowed bump landed.
      #
      # Note: fetch-metadata reports 'npm_and_yarn' and 'github_actions', but
      # dependabot.yml uses 'npm' and 'github-actions'.  The script maps these.
      - name: Patch .github/dependabot.yml
        if: steps.check.outputs.skip == 'false'
        id: patch
        env:
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          ACTION:    ${{ steps.check.outputs.action }}
          CAP:       ${{ steps.check.outputs.cap }}
          NEW_MAJOR: ${{ steps.check.outputs.new_major }}
        run: python3 .github/scripts/patch_dependabot.py

      - name: Open a PR with the config change
        if: >
          steps.check.outputs.skip == 'false' &&
          steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:  ${{ github.event.pull_request.number }}
          DEP_NAMES:  ${{ steps.meta.outputs.dependency-names }}
          PREV:       ${{ steps.meta.outputs.previous-version }}
          NEW:        ${{ steps.meta.outputs.new-version }}
          ACTION:     ${{ steps.check.outputs.action }}
          NEXT_MAJOR: ${{ steps.check.outputs.next_major }}
          CAP:        ${{ steps.check.outputs.cap }}
          NEW_MAJOR:  ${{ steps.check.outputs.new_major }}
          NEW_CAP:    ${{ steps.patch.outputs.new_cap }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$ACTION" = "cap" ]; then
            BRANCH="dependabot-cap/${DEP_NAMES//,/-}-lt${CAP}"
            BRANCH=$(printf '%s' "$BRANCH" | tr -cs 'A-Za-z0-9/_.-' '-')
            COMMIT_MSG="chore(deps): cap ${DEP_NAMES} at major < ${CAP}

          Dependabot proposed a multi-major version jump.
          Added an ignore rule so it only proposes one major at a time."
            PR_TITLE="chore(deps): cap ${DEP_NAMES} upgrades to one major at a time"
            PR_BODY="Dependabot PR #${PR_NUMBER} proposes jumping \`${DEP_NAMES}\` from \`${PREV}\` to \`${NEW}\`, which skips more than one major version at a time.

          This PR adds an \`ignore\` rule to \`.github/dependabot.yml\` that caps versions at \`>= ${CAP}\`, so Dependabot will only propose the next single-major upgrade (\`${NEXT_MAJOR}.x\`) from now on.

          Merge this first, then Dependabot will re-open #${PR_NUMBER} at the capped version on its next scheduled run."
          else
            # lift: advance the existing cap by one major.
            OLD_CAP=$(( NEW_MAJOR + 1 ))
            BRANCH="dependabot-cap/${DEP_NAMES//,/-}-lift${NEW_MAJOR}"
            BRANCH=$(printf '%s' "$BRANCH" | tr -cs 'A-Za-z0-9/_.-' '-')
            COMMIT_MSG="chore(deps): advance cap for ${DEP_NAMES} to major < ${NEW_CAP}

          Dependabot proposed the previously-capped single-major bump to ${NEW_MAJOR}.x.
          Advanced the ignore rule (>=${OLD_CAP} → >=${NEW_CAP}) so the next major can be proposed in turn."
            PR_TITLE="chore(deps): advance ${DEP_NAMES} cap to allow ${NEW_MAJOR}.x"
            PR_BODY="Dependabot PR #${PR_NUMBER} proposes the previously-capped upgrade \`${PREV}\` → \`${NEW}\`.

          This PR advances the \`ignore\` rule in \`.github/dependabot.yml\` from \`>=${OLD_CAP}\` to \`>=${NEW_CAP}\`, so Dependabot can propose the next single-major upgrade (\`${NEW_MAJOR}.x → $((NEW_MAJOR + 1)).x\`) in turn.

          Merge this alongside PR #${PR_NUMBER} so the dependency keeps advancing one major at a time."
          fi

          git checkout -b "$BRANCH"
          git add .github/dependabot.yml

          if git diff --cached --quiet; then
            echo "No changes to .github/dependabot.yml (rule already in place)."
            exit 0
          fi

          git commit -m "$COMMIT_MSG"
          git push origin "$BRANCH"

          PATCH_PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY")

          if [ "$ACTION" = "cap" ]; then
            gh pr comment "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "This PR skips more than one major version (\`${PREV}\` → \`${NEW}\`). A patch PR has been opened to cap \`.github/dependabot.yml\` at \`${NEXT_MAJOR}.x\`: ${PATCH_PR_URL}

          Closing this PR. Dependabot will re-open it at the capped version once that patch merges."
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          else
            gh pr comment "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "The cap in \`.github/dependabot.yml\` for \`${DEP_NAMES}\` has been advanced from \`>=${OLD_CAP}\` to \`>=${NEW_CAP}\` so the next major can be proposed in turn: ${PATCH_PR_URL}"
          fi
