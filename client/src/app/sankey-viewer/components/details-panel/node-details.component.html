<form class="d-flex flex-column justify-content-between">
    <fieldset class="fieldset-properties mt-2">
        <legend container="body"
                ngbTooltip="Click a checkbox to filter annotations of that type"
                placement="top left right">Node
            Details:
        </legend>
        <div ngbAccordion>
            <div ngbAccordionItem="n_desc" [collapsed]="false">
                <h2 ngbAccordionHeader>
                    <button ngbAccordionButton>Description</button>
                </h2>
                <div ngbAccordionCollapse>
                    <div ngbAccordionBody>
                        <ng-template>
                            <p [innerHTML]="entity.description" [style.whiteSpace]="'pre-wrap'"></p>
                        </ng-template>
                    </div>
                </div>
            </div>
            <div ngbAccordionItem [disabled]="true">
                <h2 ngbAccordionHeader>
                    <app-button-with-selectable-text ngbAccordionToggle [disabled]="true">
                        <b title>Value</b>
                        {{ parseProperty(entity._value) }}
                    </app-button-with-selectable-text>
                </h2>
                <div ngbAccordionCollapse><div ngbAccordionBody><ng-template></ng-template></div></div>
            </div>
            <div ngbAccordionItem [disabled]="true">
                <h2 ngbAccordionHeader>
                    <app-button-with-selectable-text ngbAccordionToggle [disabled]="true">
                        <b title>Label</b>
                        {{ parseProperty(entity.label) }}
                    </app-button-with-selectable-text>
                </h2>
                <div ngbAccordionCollapse><div ngbAccordionBody><ng-template></ng-template></div></div>
            </div>
            <div ngbAccordionItem [disabled]="true" *ngIf="entity.stId">
                <h2 ngbAccordionHeader>
                    <a [href]="reactomeLink(entity.stId)"
                       class="btn btn-link w-100 d-flex align-items-center justify-content-between"
                       target="_blank">
                        <span>Reactome</span>
                        {{ entity.stId }}
                    </a>
                </h2>
                <div ngbAccordionCollapse><div ngbAccordionBody><ng-template></ng-template></div></div>
            </div>
            <div ngbAccordionItem [disabled]="true" *ngIf="entity.biocyc_id">
                <h2 ngbAccordionHeader>
                    <a [href]="biocycLink(entity.biocyc_id)"
                       class="btn btn-link w-100 d-flex align-items-center justify-content-between"
                       target="_blank">
                        <span>BioCyc</span>
                        {{ entity.biocyc_id }}
                    </a>
                </h2>
                <div ngbAccordionCollapse><div ngbAccordionBody><ng-template></ng-template></div></div>
            </div>
            <div ngbAccordionItem>
                <h2 ngbAccordionHeader>
                    <button ngbAccordionButton>Neo4j Labels</button>
                </h2>
                <div ngbAccordionCollapse>
                    <div ngbAccordionBody>
                        <ng-template>
                            <ul class="list-group list-group-flush">
                                <li *ngFor="let label of entity.labels"
                                    class="list-group-item"
                                >{{ label }}</li>
                            </ul>
                        </ng-template>
                    </div>
                </div>
            </div>
            <div ngbAccordionItem>
                <h2 ngbAccordionHeader>
                    <button ngbAccordionButton>Properties</button>
                </h2>
                <div ngbAccordionCollapse>
                    <div ngbAccordionBody>
                        <ng-template>
                            <ul class="list-group list-group-flush">
                                <li *ngFor="let property of options.nodeValueAccessors | keyvalue"
                                    [ngClass]="{
                                        'list-group-item': true,
                                         'd-flex': true,
                                         'flex-wrap': true,
                                         'justify-content-between': true,
                                        active: property.key === state.nodeValueAccessorId
                                      }"
                                ><b>{{ property.value.description }}</b>{{parseProperty(entity[property.value.description])}}</li>
                            </ul>
                        </ng-template>
                    </div>
                </div>
            </div>
            <div ngbAccordionItem>
                <h2 ngbAccordionHeader>
                    <button ngbAccordionButton>Details</button>
                </h2>
                <div ngbAccordionCollapse>
                    <div ngbAccordionBody>
                        <ng-template>
                            <app-object-explorer [dataSource]="entity"></app-object-explorer>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>
</form>
