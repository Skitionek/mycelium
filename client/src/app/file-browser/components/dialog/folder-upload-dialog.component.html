<form [formGroup]="form" (ngSubmit)="submit()">
  <app-modal-header (cancel)="cancel()">
    {{ title }}
  </app-modal-header>

  <app-modal-body>
    <app-form-input-feedback [control]="form" [formLevel]="true"></app-form-input-feedback>

    <app-form-row for="folder-input" label="Folder" [control]="form.get('files')">
      <div class="d-flex align-items-center text-truncate">
        <button type="button" class="btn btn-secondary me-2" (click)="showFolderDialog()">
          Browse...
        </button>
        <div class="text-truncate" *ngIf="selectedFiles.length > 0; else noFolderChosen">
          <i class="fa fa-fw fa-folder-open text-icon"></i>
          {{ folderName }}
        </div>
        <ng-template #noFolderChosen>
        </ng-template>
      </div>
      <!-- webkitdirectory is the standard attribute for folder selection -->
      <input type="file" id="folder-input" (change)="folderChanged($event)"
             class="d-none" #folderInput webkitdirectory directory>
    </app-form-row>

    <div class="mt-3" *ngIf="selectedFiles.length > 0">
      <p class="text-muted mb-0">
        <i class="fa fa-fw fa-info-circle"></i>
        {{ getStructureSummary() }}
      </p>
    </div>
  </app-modal-body>

  <app-modal-footer>
    <button type="button" class="btn btn-secondary me-2" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Upload</button>
  </app-modal-footer>
</form>
