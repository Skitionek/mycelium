<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Data Management Plans</h2>
    <button type="button" class="btn btn-primary" (click)="create()">New DMP</button>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <div *ngIf="loading">Loading&hellip;</div>

  <table class="table table-hover" *ngIf="!loading && records.length">
    <thead>
      <tr>
        <th>Title</th>
        <th>Created</th>
        <th>Modified</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let record of records" (click)="open(record)" style="cursor: pointer;">
        <td>{{ record.title }}</td>
        <td>{{ record.creationDate | date: 'short' }}</td>
        <td>{{ record.modifiedDate | date: 'short' }}</td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-outline-danger" (click)="remove(record, $event)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !records.length" class="text-muted">
    No DMP documents yet. Click "New DMP" to create one.
  </p>
</div>
