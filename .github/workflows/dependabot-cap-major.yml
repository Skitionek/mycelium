name: Cap Dependabot major bumps

# What this does
# --------------
# When Dependabot proposes a bump that skips more than one major version
# (e.g. 1.x → 3.x), this workflow:
#   1. Creates a short-lived branch, patches .github/dependabot.yml to add an
#      `ignore` rule that caps the package at the next single major (prev+2
#      exclusive), and opens a PR against the default branch.
#   2. Comments on the original Dependabot PR explaining what happened and
#      closes it; once the patch PR merges, Dependabot will re-open it for
#      the single-major bump on its next scheduled run.
#
# When Dependabot proposes a single-major bump (diff == 1) and there is an
# existing cap rule `>= new_major+1` for that package, the workflow opens a
# separate PR to lift (remove) that cap, so the next single-major cycle can
# proceed unblocked.
#
# No special credentials are required — GITHUB_TOKEN with contents:write and
# pull-requests:write is sufficient because this workflow only pushes to a
# new branch, not directly to the protected default branch.
#
# Why pull_request_target
# -----------------------
# A Dependabot-triggered `pull_request` event gets a read-only token and
# cannot read Actions secrets. `pull_request_target` runs in the base repo's
# context instead. This job never checks out or executes code from the PR
# head, so that is safe.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-cap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cap:
    name: Cap if multi-major
    runs-on: ubuntu-latest
    # Only act on Dependabot PRs; skip drafts (they are never multi-major caps).
    if: >
      startsWith(github.event.pull_request.user.login, 'dependabot') &&
      !github.event.pull_request.draft

    steps:
      # fetch-metadata parses the Dependabot commit message to surface the
      # version delta without needing to inspect lockfiles or manifests.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Parse the major-version delta and decide what action to take:
      #   skip=true, lift=false  — not a major bump, nothing to do
      #   skip=true, lift=true   — single-major bump; open a cap-lift PR if a
      #                            matching cap rule exists in dependabot.yml
      #   skip=false, lift=false — multi-major bump; write a new cap rule
      - name: Determine whether to cap or lift
        id: check
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW:  ${{ steps.meta.outputs.new-version }}
        run: |
          set -euo pipefail

          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            echo "Not a major bump (type: $UPDATE_TYPE); skipping."
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "lift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip any leading non-numeric prefix (e.g. "v1.2.3" → 1).
          prev_major=$(printf '%s' "$PREV" | grep -oP '^\D*\K[0-9]+' || true)
          new_major=$(printf '%s' "$NEW"  | grep -oP '^\D*\K[0-9]+' || true)

          if [ -z "$prev_major" ] || [ -z "$new_major" ]; then
            echo "::warning::Cannot parse major versions from '$PREV' → '$NEW'; skipping."
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "lift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff=$((new_major - prev_major))

          if [ "$diff" -eq 1 ]; then
            echo "Single-major bump ($PREV → $NEW); will check for a cap to lift."
            echo "skip=true"           >> "$GITHUB_OUTPUT"
            echo "lift=true"           >> "$GITHUB_OUTPUT"
            echo "prev_major=$prev_major" >> "$GITHUB_OUTPUT"
            echo "new_major=$new_major"   >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$diff" -le 0 ]; then
            echo "::warning::Non-positive major diff ($PREV → $NEW); skipping."
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "lift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Multi-major bump: cap at next single major (prev+2 exclusive).
          cap=$((prev_major + 2))
          next_major=$((prev_major + 1))

          echo "Multi-major bump: $PREV → $NEW (${diff} majors). Capping at < $cap."
          echo "skip=false"            >> "$GITHUB_OUTPUT"
          echo "lift=false"            >> "$GITHUB_OUTPUT"
          echo "prev_major=$prev_major"   >> "$GITHUB_OUTPUT"
          echo "new_major=$new_major"     >> "$GITHUB_OUTPUT"
          echo "next_major=$next_major"   >> "$GITHUB_OUTPUT"
          echo "cap=$cap"                 >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Multi-major path: check out, patch, open cap PR
      # -----------------------------------------------------------------------

      # Check out the default branch so we can branch off it for the patch PR.
      - name: Check out default branch (cap)
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install ruamel.yaml (cap)
        if: steps.check.outputs.skip == 'false'
        run: pip install --quiet 'ruamel.yaml>=0.18'

      # Delegate YAML editing to the versioned script so the logic is testable.
      - name: Add cap rule to .github/dependabot.yml
        if: steps.check.outputs.skip == 'false'
        env:
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          CAP:       ${{ steps.check.outputs.cap }}
        run: |
          python3 .github/scripts/dependabot_cap.py add \
            --dep-names  "$DEP_NAMES" \
            --ecosystem  "$ECOSYSTEM" \
            --directory  "$DIRECTORY" \
            --cap        "$CAP"

      - name: Open a PR with the cap rule
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:  ${{ github.event.pull_request.number }}
          DEP_NAMES:  ${{ steps.meta.outputs.dependency-names }}
          PREV:       ${{ steps.meta.outputs.previous-version }}
          NEW:        ${{ steps.meta.outputs.new-version }}
          NEXT_MAJOR: ${{ steps.check.outputs.next_major }}
          CAP:        ${{ steps.check.outputs.cap }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="dependabot-cap/${DEP_NAMES//,/-}-lt${CAP}"
          # Sanitise branch name: spaces and special chars → hyphens.
          BRANCH=$(printf '%s' "$BRANCH" | tr -cs 'A-Za-z0-9/_.-' '-')

          git checkout -b "$BRANCH"
          git add .github/dependabot.yml

          if git diff --cached --quiet; then
            echo "No changes to .github/dependabot.yml (cap rule already in place)."
            exit 0
          fi

          git commit -m "chore(deps): cap ${DEP_NAMES} at major < ${CAP}

          Dependabot proposed a multi-major version jump.
          Added an ignore rule so it only proposes one major at a time."
          git push origin "$BRANCH"

          PATCH_PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore(deps): cap ${DEP_NAMES} upgrades to one major at a time" \
            --body "$(cat <<BODY
          Dependabot PR #${PR_NUMBER} proposes jumping \`${DEP_NAMES}\` from \`${PREV}\` to \`${NEW}\`, which skips more than one major version at a time.

          This PR adds an \`ignore\` rule to \`.github/dependabot.yml\` that caps versions at \`>= ${CAP}\`, so Dependabot will only propose the next single-major upgrade (\`${NEXT_MAJOR}.x\`) from now on.

          Merge this first, then Dependabot will re-open #${PR_NUMBER} at the capped version on its next scheduled run.
          BODY
          )")

          # Comment on the original Dependabot PR so it links back.
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "This PR skips more than one major version (\`${PREV}\` → \`${NEW}\`). A patch PR has been opened to cap \`.github/dependabot.yml\` at \`${NEXT_MAJOR}.x\`: ${PATCH_PR_URL}

          Closing this PR. Dependabot will re-open it at the capped version once that patch merges."
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

      # -----------------------------------------------------------------------
      # Single-major path: check out, lift the >=new_major+1 cap if present
      # -----------------------------------------------------------------------

      # Check out the default branch so we can branch off it for the lift PR.
      - name: Check out default branch (lift)
        if: steps.check.outputs.lift == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install ruamel.yaml (lift)
        if: steps.check.outputs.lift == 'true'
        run: pip install --quiet 'ruamel.yaml>=0.18'

      # Remove the cap that was blocking the now-landing major version.
      # The script exits 0 and prints "unchanged" when no matching rule exists,
      # so this step is always safe to run.
      - name: Lift cap rule from .github/dependabot.yml
        id: lift
        if: steps.check.outputs.lift == 'true'
        env:
          DEP_NAMES:  ${{ steps.meta.outputs.dependency-names }}
          ECOSYSTEM:  ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY:  ${{ steps.meta.outputs.directory }}
          NEW_MAJOR:  ${{ steps.check.outputs.new_major }}
        run: |
          result=$(python3 .github/scripts/dependabot_cap.py lift \
            --dep-names  "$DEP_NAMES" \
            --ecosystem  "$ECOSYSTEM" \
            --directory  "$DIRECTORY" \
            --new-major  "$NEW_MAJOR")
          echo "$result"
          # Surface whether a rule was actually removed so the next step can
          # skip the git/PR work when nothing changed.
          echo "result=${result##*$'\n'}" >> "$GITHUB_OUTPUT"

      - name: Open a PR to lift the cap
        if: >
          steps.check.outputs.lift == 'true' &&
          steps.lift.outputs.result == 'changed'
        env:
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
          PREV:      ${{ steps.meta.outputs.previous-version }}
          NEW:       ${{ steps.meta.outputs.new-version }}
          NEW_MAJOR: ${{ steps.check.outputs.new_major }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="dependabot-cap-lift/${DEP_NAMES//,/-}-gte${NEW_MAJOR}"
          BRANCH=$(printf '%s' "$BRANCH" | tr -cs 'A-Za-z0-9/_.-' '-')

          git checkout -b "$BRANCH"
          git add .github/dependabot.yml

          if git diff --cached --quiet; then
            echo "No staged changes after lift; skipping PR."
            exit 0
          fi

          LIFTED=$((NEW_MAJOR + 1))
          git commit -m "chore(deps): lift cap on ${DEP_NAMES} — remove >=${LIFTED} restriction

          Cap '>=${LIFTED}' was written to route a multi-major Dependabot bump
          one step at a time. Dependabot now proposes the single-major bump to
          ${NEW_MAJOR}.x, so the cap is no longer needed."
          git push origin "$BRANCH"

          LIFT_PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore(deps): lift \`>=${LIFTED}\` cap on ${DEP_NAMES}" \
            --body "$(cat <<BODY
          Dependabot PR #${PR_NUMBER} proposes the single-major bump \`${DEP_NAMES}\` \`${PREV}\` → \`${NEW}\`.

          An existing \`ignore\` rule (\`>= ${LIFTED}\`) was written by the cap workflow to route a larger version jump one step at a time. That bump is now landing, so the cap is no longer needed.

          Merge this alongside (or before) the Dependabot bump so the next single-major upgrade can proceed.
          BODY
          )")

          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "This single-major bump will land \`${DEP_NAMES}\` at \`${NEW_MAJOR}.x\`. An existing version cap (\`>= ${LIFTED}\`) has been removed in ${LIFT_PR_URL} so the next cycle can continue."
